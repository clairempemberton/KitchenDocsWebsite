<!-- Same data-plate mark as the inline SVG in the page headers, drawn a touch
     heavier on purpose: 1.6px strokes and r=1 rivets disappear at 16px, so the
     favicon uses 1.8px strokes and r=1.1. Change both together. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 34 34" width="34" height="34">
  <rect width="34" height="34" rx="8" fill="#14181B"/>
  <rect x="7" y="9.5" width="20" height="15" rx="2.5" fill="none" stroke="#7FB6FF" stroke-width="1.8"/>
  <circle cx="10" cy="12.5" r="1.1" fill="#7FB6FF"/>
  <circle cx="24" cy="12.5" r="1.1" fill="#7FB6FF"/>
  <circle cx="10" cy="21.5" r="1.1" fill="#7FB6FF"/>
  <circle cx="24" cy="21.5" r="1.1" fill="#7FB6FF"/>
  <rect x="12.5" y="14.9" width="9" height="1.7" rx="0.85" fill="#EDEFEC"/>
  <rect x="12.5" y="18.1" width="6" height="1.7" rx="0.85" fill="#8A9298"/>
</svg>
